<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Diagram: a FastAPI backend, a CI pipeline, and a batch script all call anycli's async run(); anycli's middleware drives local agent CLI backends and streams typed chunks back. Claude Code is supported today; Gemini CLI and Codex CLI adapters are on the roadmap.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#132148"/>
      <stop offset="55%" stop-color="#0D1630"/>
      <stop offset="100%" stop-color="#080D1D"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B4CCA"/>
    </linearGradient>
    <linearGradient id="gemgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4796E3"/>
      <stop offset="50%" stop-color="#7A83EE"/>
      <stop offset="100%" stop-color="#9177C7"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#3A4A78" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#67E8F9"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="18" fill="url(#dots)"/>

  <!-- left column: where you call it from -->
  <text x="168" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#8CA3D8" text-anchor="middle">Your code</text>

  <g>
    <rect x="48" y="168" width="240" height="64" rx="16" fill="#141E3C" stroke="#2E3F6E" stroke-width="1.5"/>
    <rect x="62" y="183" width="34" height="34" rx="8" fill="#1D2A50" stroke="#39518F" stroke-width="1.2"/>
    <text x="79" y="206" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8FB4FF" text-anchor="middle">API</text>
    <text x="108" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#DCE6FF">FastAPI backend</text>
  </g>
  <g>
    <rect x="48" y="283" width="240" height="64" rx="16" fill="#141E3C" stroke="#2E3F6E" stroke-width="1.5"/>
    <rect x="62" y="298" width="34" height="34" rx="8" fill="#1D2A50" stroke="#39518F" stroke-width="1.2"/>
    <text x="79" y="321" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8FB4FF" text-anchor="middle">CI</text>
    <text x="108" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#DCE6FF">CI pipeline</text>
  </g>
  <g>
    <rect x="48" y="398" width="240" height="64" rx="16" fill="#141E3C" stroke="#2E3F6E" stroke-width="1.5"/>
    <rect x="62" y="413" width="34" height="34" rx="8" fill="#1D2A50" stroke="#39518F" stroke-width="1.2"/>
    <text x="79" y="436" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8FB4FF" text-anchor="middle">&gt;_</text>
    <text x="108" y="437" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#DCE6FF">Batch script</text>
  </g>

  <!-- converging paths in -->
  <g stroke="#67E8F9" stroke-width="2.5" fill="none" filter="url(#softglow)">
    <path d="M288,200 H322 Q340,200 340,218 V297 Q340,315 358,315"/>
    <path d="M288,315 H358"/>
    <path d="M288,430 H322 Q340,430 340,412 V333 Q340,315 358,315"/>
    <path d="M358,315 H438" marker-end="url(#arrow)"/>
  </g>
  <text x="398" y="352" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#7DD3FC" text-anchor="middle">bridge.run()</text>

  <!-- center hub: the square logo tile -->
  <g>
    <rect x="442" y="197" width="236" height="236" rx="56" fill="#4F46E5" opacity="0.12"/>
    <rect x="460" y="215" width="200" height="200" rx="48" fill="#4F46E5" opacity="0.25"/>
    <rect x="480" y="235" width="160" height="160" rx="37" fill="url(#core)" filter="url(#glow)"/>
    <g transform="translate(480,235) scale(0.3125)">
      <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round">
        <path d="M132,256 H232"/>
        <path d="M232,256 C296,256 304,168 372,168"/>
        <path d="M232,256 H372"/>
        <path d="M232,256 C296,256 304,344 372,344"/>
      </g>
      <circle cx="130" cy="256" r="40" fill="#FFFFFF"/>
      <circle cx="384" cy="168" r="32" fill="#FFFFFF"/>
      <circle cx="388" cy="256" r="32" fill="#FFFFFF"/>
      <circle cx="384" cy="344" r="32" fill="#FFFFFF"/>
    </g>
    <text x="560" y="428" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8CA3D8" text-anchor="middle">concurrency governor · watchdog · retry</text>
    <text x="560" y="482" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle">anycli</text>
  </g>

  <!-- branches out -->
  <g stroke="#67E8F9" stroke-width="2.5" fill="none" filter="url(#softglow)">
    <path d="M678,315 H738 Q756,315 756,297 V218 Q756,200 774,200 H806" marker-end="url(#arrow)"/>
    <path d="M678,315 H806" marker-end="url(#arrow)"/>
    <path d="M678,315 H738 Q756,315 756,333 V412 Q756,430 774,430 H806" marker-end="url(#arrow)"/>
  </g>
  <text x="700" y="302" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC" text-anchor="middle">typed chunks</text>

  <!-- right column -->
  <text x="985" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#8CA3D8" text-anchor="middle">Agent CLI backends</text>

